name: API (.NET)

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restaurar
        run: dotnet restore Florisa.slnx
      - name: Compilar
        run: dotnet build Florisa.slnx --no-restore -c Release
      - name: Testar
        run: dotnet test Florisa.slnx --no-build -c Release --logger "console;verbosity=normal" --logger GitHubActions
